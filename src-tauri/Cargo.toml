[package]
name = "mudrix-desktop"
# Kept in step with package.json (the single source of truth, see scripts/set-version.mjs).
version = "26.10.17"
description = "Mudrix Desktop: the Mudrix web client in a Tauri shell."
authors = ["kapsikkum", "Arian Farahani", "Jan Philipp Kleinschmidt"]
license = "AGPL-3.0-only"
repository = "https://github.com/kapsikkum/mudrix-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mudrix_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "Mudrix"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# The version webview2-com uses: hides the WebView2 screen share bar, registers the toast app id,
# and the native screen/window capture (src/capture: Windows.Graphics.Capture, D3D11, WASAPI).
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Media",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Needed by `#[implement]` (the WASAPI activation callback in src/capture/audio.rs).
windows-core = "0.62"
# Capture picker thumbnails (JPEG) and window icons (PNG); only those two codecs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
# The version tauri-plugin-notification uses; toasts under our own AppUserModelID (see toast.rs).
tauri-winrt-notification = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
