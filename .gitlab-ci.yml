variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_STRATEGY: clone
  DRY_RUN: 'false'

stages:
  - prepare
  - build
  - release

prepare:
  stage: prepare
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $WEB_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $VERSION =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache git curl
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      TAG="${WEB_TAG:-$VERSION}"
      VERSION_BARE="${TAG#v}"
      BRANCH="prepare/${TAG}"
      echo "=== Preparing desktop release ${TAG} ==="
      git checkout main
      git submodule update --init
      git -C wizardchat-web fetch origin
      if git -C wizardchat-web rev-parse "tags/${TAG}" >/dev/null 2>&1; then
        git -C wizardchat-web checkout "tags/${TAG}"
      else
        echo "Warning: Web tag ${TAG} not found, using latest main"
        git -C wizardchat-web checkout origin/main
      fi
      git checkout -b "$BRANCH"
      npm version "${VERSION_BARE}" --no-git-tag-version
      git add package.json wizardchat-web
      [ -f package-lock.json ] && git add package-lock.json
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: showing diff, skipping commit + push + MR ==="
        git diff --cached
        exit 0
      fi
      git commit -m "chore(release): prepare ${TAG}"
      git push origin "$BRANCH" --force
      echo "=== Creating tag ${TAG} ==="
      git tag -f "$TAG" HEAD
      git push origin "$TAG" --force
      curl --silent --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"chore(release): prepare ${TAG}\",
          \"description\": \"Bumps desktop to \`${VERSION_BARE}\` and pins \`wizardchat-web\` submodule to \`${TAG}\`.\",
          \"labels\": \"release\",
          \"remove_source_branch\": true,
          \"squash\": true
        }" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
      echo "=== MR created for ${TAG} ==="

build:web:
  image: node:20
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - npm run build:web
  artifacts:
    paths:
      - wizardchat-web/dist/
    expire_in: 1 day

build:mac:
  tags: [saas-macos-medium-m1]
  stage: build
  needs: [build:web]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - npm ci --ignore-scripts
    - npm run build:electron
    - npx electron-builder --mac --publish=never --config.extraMetadata.version="${CI_COMMIT_TAG#v}"
  artifacts:
    paths:
      - release/
    expire_in: 1 day

build:linux:
  image: node:20
  stage: build
  needs: [build:web]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apt-get update -qq && apt-get install -y -qq libxkbcommon-x11-0 libgtk-3-0 libnss3 libxss1 libasound2 2>/dev/null || true
  script:
    - npm ci --ignore-scripts
    - npm run build:electron
    - npx electron-builder --linux --publish=never --config.extraMetadata.version="${CI_COMMIT_TAG#v}"
  artifacts:
    paths:
      - release/
    expire_in: 1 day

build:win:
  tags: [saas-windows-medium-amd64]
  stage: build
  needs: [build:web]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - npm ci --ignore-scripts
    - npm run build:electron
    - npx electron-builder --win --publish=never --config.extraMetadata.version="$($env:CI_COMMIT_TAG.Substring(1))"
  artifacts:
    paths:
      - release/
    expire_in: 1 day

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  needs:
    - build:mac
    - build:linux
    - build:win
  before_script:
    - apk add --no-cache jq curl bash
  script:
    - |
      bash <<'SCRIPT'
      ASSETS_ARGS=()
      for f in release/*; do
        [ -f "$f" ] || continue
        filename=$(basename "$f")
        echo "Uploading $filename..."
        filename_encoded=$(printf '%s' "$filename" | jq -sRr @uri)
        curl --fail --show-error --header "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
          --upload-file "$f" \
          "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/wizardchat-desktop/${CI_COMMIT_TAG}/${filename_encoded}"
        download_url="https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/generic/wizardchat-desktop/${CI_COMMIT_TAG}/${filename_encoded}"
        ASSETS_ARGS+=(--assets-link "{\"name\":\"$filename\",\"url\":\"${download_url}\"}")
      done
      RELEASE_NOTES="Desktop release ${CI_COMMIT_TAG} — see wizardchat-web v${CI_COMMIT_TAG#v} for detailed changelog: https://${CI_SERVER_HOST}/wizardchat/wizardchat-web/-/releases/${CI_COMMIT_TAG}"
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$RELEASE_NOTES" \
        "${ASSETS_ARGS[@]}"
      SCRIPT
