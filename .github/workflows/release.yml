name: Release

# Tag-triggered: push v26.10.3 and this builds the desktop installers for Windows
# (NSIS + MSI), macOS (universal dmg) and Linux (AppImage, deb, rpm) and attaches them to
# a GitHub Release. A tag with a suffix (v26.10.3-next.1, -rc.1, -beta.1) is published as a
# pre-release, which GitHub does not treat as "latest".
#
# Installers are NOT code-signed (no certificates or notarization), but the in-app updater
# artifacts are signed with the minisign key in TAURI_SIGNING_PRIVATE_KEY, which is required:
# a release without it would ship an updater that nobody can verify (see RELEASING.md). The
# release also carries latest.json, which tauri-plugin-updater reads.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v); must match package.json'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set (see RELEASING.md)."
            exit 1
          fi
      # The public key in tauri.conf.json must not be the placeholder.
      - name: Check the updater public key
        run: |
          if grep -q REPLACE_WITH src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder."
            exit 1
          fi
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # One version across package.json, Cargo.toml and the tag.
      - name: Check the version everywhere
        run: node scripts/check-version.mjs "v${{ steps.version.outputs.value }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            args: ''
          - platform: macos-latest
            name: macos-universal
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            name: linux-x64
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
      VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux system libraries for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mudrix-web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # Element Call is built from our fork (the mudrix-web/element-call submodule) with pnpm.

      - run: corepack enable pnpm

      - run: npm ci

      # MSI (WiX) only accepts numeric pre-release versions, so a -next/-rc/-beta tag builds
      # the NSIS installer only on Windows.
      - name: Choose the Windows bundles
        id: bundles
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            echo "args=${{ matrix.args }} --bundles nsis" >> "$GITHUB_OUTPUT"
          else
            echo "args=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
          fi

      # tauri-action runs `npm run build:web` (tauri.conf.json beforeBuildCommand) first.
      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required (checked in the prepare job): signs the updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        with:
          # No tagName: the release is created once, by the last job, from the renamed files.
          args: ${{ steps.bundles.outputs.args }}

      # tauri-action has no "upload as a workflow artifact" input, so collect the bundler output
      # (installers, updater archives and their .sig files) ourselves for rename-assets.
      - name: List bundle files
        id: artifact_paths
        shell: bash
        run: |
          {
            echo 'list<<ARTIFACT_PATHS_EOF'
            find src-tauri/target -type f -path '*/release/bundle/*' -not -path '*.AppDir/*' \
              \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
                 -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sig' \)
            echo 'ARTIFACT_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ steps.artifact_paths.outputs.list }}
          if-no-files-found: error
          retention-days: 1

  rename-assets:
    # tauri-action names files after the bundler (Mudrix_26.10.3_x64-setup.exe). Re-upload them as
    # Mudrix-<version>-<platform>.<ext> (these names are also what installs that still run the old
    # updater look for), add checksums and write latest.json for tauri-plugin-updater.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename, write latest.json and checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *-setup.exe)           name="windows-x64-setup.exe" ;;
              *-setup.exe.sig)       name="windows-x64-setup.exe.sig" ;;
              *.msi)                 name="windows-x64.msi" ;;
              *.dmg)                 name="macos-universal.dmg" ;;
              *.app.tar.gz)          name="macos-universal.app.tar.gz" ;;
              *.app.tar.gz.sig)      name="macos-universal.app.tar.gz.sig" ;;
              *.AppImage)            name="linux-x64.AppImage" ;;
              *.AppImage.sig)        name="linux-x64.AppImage.sig" ;;
              *.deb)                 name="linux-x64.deb" ;;
              *.rpm)                 name="linux-x64.rpm" ;;
              *) continue ;;
            esac
            cp "$f" "out/Mudrix-${VERSION}-${name}"
          done

          # Every updater artifact must exist and be signed, or the release is broken.
          for f in windows-x64-setup.exe macos-universal.app.tar.gz linux-x64.AppImage; do
            for part in "out/Mudrix-${VERSION}-${f}" "out/Mudrix-${VERSION}-${f}.sig"; do
              [ -s "$part" ] || { echo "::error::missing updater file $part"; exit 1; }
            done
          done

          base="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          entry() { # $1 file name (without Mudrix-<v>-), prints {"signature":...,"url":...}
            jq -n --rawfile sig "out/Mudrix-${VERSION}-$1.sig" --arg url "${base}/Mudrix-${VERSION}-$1" '{signature: ($sig | rtrimstr("\n")), url: $url}'
          }
          jq -n --arg version "$VERSION" --arg notes "Mudrix Desktop ${VERSION}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$(entry windows-x64-setup.exe)" \
            --argjson mac "$(entry macos-universal.app.tar.gz)" \
            --argjson linux "$(entry linux-x64.AppImage)" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": $win,
               "darwin-aarch64": $mac,
               "darwin-x86_64": $mac,
               "linux-x86_64": $linux}}' > out/latest.json
          cat out/latest.json

          ls -la out
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          name: Mudrix Desktop ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            Mudrix Desktop ${{ needs.prepare.outputs.version }}.

            These builds are **not code-signed**. Windows SmartScreen ("More info", then "Run anyway")
            and macOS Gatekeeper (System Settings, Privacy & Security, "Open Anyway") will ask you to
            confirm the first launch. Linux: use the AppImage, .deb or .rpm.
          files: out/*
