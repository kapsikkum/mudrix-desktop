name: Release

# Tag-triggered: push v26.10.3 and this builds the desktop installers for Windows
# (NSIS + MSI), macOS (universal dmg) and Linux (AppImage, deb, rpm) and attaches them to
# a GitHub Release. A tag with a suffix (v26.10.3-next.1, -rc.1, -beta.1) is published as a
# pre-release, which GitHub does not treat as "latest".
#
# Builds are UNSIGNED: no certificates or notarization are used. If the optional
# TAURI_SIGNING_PRIVATE_KEY secret exists, updater artifacts are signed too (see RELEASING.md).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v); must match package.json'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # One version across package.json, Cargo.toml and the tag.
      - name: Check the version everywhere
        run: node scripts/check-version.mjs "v${{ steps.version.outputs.value }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            args: ''
          - platform: macos-latest
            name: macos-universal
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            name: linux-x64
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux system libraries for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mudrix-web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: npm ci

      # MSI (WiX) only accepts numeric pre-release versions, so a -next/-rc/-beta tag builds
      # the NSIS installer only on Windows.
      - name: Choose the Windows bundles
        id: bundles
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            echo "args=${{ matrix.args }} --bundles nsis" >> "$GITHUB_OUTPUT"
          else
            echo "args=${{ matrix.args }}" >> "$GITHUB_OUTPUT"
          fi

      # tauri-action runs `npm run build:web` (tauri.conf.json beforeBuildCommand) first.
      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: only used (to sign updater artifacts) when the secret exists.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No tagName: the release is created once, by the last job, from the renamed files.
          args: ${{ steps.bundles.outputs.args }}

      # tauri-action has no "upload as a workflow artifact" input; hand the exact files it
      # built to upload-artifact ourselves so rename-assets can collect them. artifactPaths
      # is a JSON-encoded array as a string, not a newline list, so unpack it with jq first.
      - name: List artifact paths
        id: artifact_paths
        shell: bash
        run: |
          {
            echo 'list<<ARTIFACT_PATHS_EOF'
            echo '${{ steps.tauri_build.outputs.artifactPaths }}' | jq -r '.[]'
            echo 'ARTIFACT_PATHS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ steps.artifact_paths.outputs.list }}
          if-no-files-found: error
          retention-days: 1

  rename-assets:
    # tauri-action names files after the bundler (Mudrix_26.10.3_x64-setup.exe). Re-upload them as
    # Mudrix-<version>-<platform>.<ext> and add checksums.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename and checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          find artifacts -type f | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *-setup.exe)       platform="windows-x64-setup";   ext="exe" ;;
              *.msi)             platform="windows-x64";         ext="msi" ;;
              *.dmg)             platform="macos-universal";     ext="dmg" ;;
              *.AppImage)        platform="linux-x64";           ext="AppImage" ;;
              *.deb)             platform="linux-x64";           ext="deb" ;;
              *.rpm)             platform="linux-x64";           ext="rpm" ;;
              *) continue ;;
            esac
            cp "$f" "out/Mudrix-${VERSION}-${platform}.${ext}"
          done
          ls -la out
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          name: Mudrix Desktop ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            Mudrix Desktop ${{ needs.prepare.outputs.version }}.

            These builds are **not code-signed**. Windows SmartScreen ("More info", then "Run anyway")
            and macOS Gatekeeper (System Settings, Privacy & Security, "Open Anyway") will ask you to
            confirm the first launch. Linux: use the AppImage, .deb or .rpm.
          files: out/*
