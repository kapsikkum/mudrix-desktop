appId: org.wizardchat.desktop
productName: WizardChat

directories:
  output: release

files:
  - dist/**/*

extraResources:
  - from: wizardchat-web/dist
    to: web-app

asar: true

afterPack: build-resources/after-pack.cjs

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: icons/icon.icns
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: "WizardChat needs camera access for video calls"
    NSMicrophoneUsageDescription: "WizardChat needs microphone access for voice calls"
    NSScreenCaptureUsageDescription: "WizardChat needs screen access for sharing during calls"

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network
  icon: icons/source/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: icons/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WizardChat
  artifactName: "${productName}-Setup-${version}.${ext}"

publish:
  - provider: generic
    url: https://gitlab.com
